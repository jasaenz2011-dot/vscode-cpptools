[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "district-lesson-generator"
version = "0.1.0"
description = "Generate standards-aligned lessons and intervention materials from a district's own scope and sequence, standards, and resources -- locally."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["education", "curriculum", "lesson-planning", "rag", "local-llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]

# Intentionally empty: everything required is in the standard library.
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
fast = ["numpy>=1.24"]
streamlit = ["streamlit>=1.30"]
embeddings = ["sentence-transformers>=2.2"]
all = ["pypdf>=4.0", "numpy>=1.24", "streamlit>=1.30", "sentence-transformers>=2.2"]

[project.scripts]
dlg = "dlg.cli:main"

[tool.setuptools]
packages = ["dlg", "dlg.agents"]

[tool.setuptools.package-data]
dlg = ["prompts/*.md"]
